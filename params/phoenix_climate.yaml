    source_url: https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-hourly&stations=72278023183&startDate=2023-06-01&endDate=2023-08-31&dataTypes=TMP&format=csv
    retrieved: '2026-09-22'
    license: U.S. Government work (NOAA NCEI); no copyright restrictions in the U.S.
    units:
      temp_c: degC
    parents: []
